global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http

listen stats  # веб-страница со статистикой
        bind                    :888
        mode                    http
        stats                   enable
        stats uri               /stats
        stats refresh           5s
        stats realm             Haproxy\ Statistics
        
frontend example  # секция фронтенд
        mode http
        bind *:80 # HAProxy будет слушать HTTP-трафик на стандартном порту 80

    	# ACL для домена example.local
    	acl ACL_example.local hdr(host) -i example.local
    	
    	# Использовать бэкенд web_servers, если домен соответствует
	use_backend web_servers if ACL_example.local
	
	default_backend default_response # Отправлять весь другой трафик на default_response

backend web_servers    # секция бэкенд
        mode http
        balance roundrobin # Weighted Round Robin является вариацией Round Robin, HAProxy автоматически учитывает веса
        option httpchk GET / # Проверка состояния серверов по HTTP GET запросу к корневому пути
        
	# Серверы с указанными весами
    	server s1 127.0.0.1:8000 check weight 2
    	server s2 127.0.0.1:8001 check weight 3
    	server s3 127.0.0.1:8002 check weight 4

backend default_response
    	mode http
    	# Возвращаем простую страницу для трафика, который не адресован example.local
    	errorfile 503 /etc/haproxy/errors/503.http # Можно использовать стандартную ошибку 503
    	# Или просто вернуть простой ответ
    	http-request return status 200 content-type "text/plain" string "Access denied or wrong domain. Please use example.local."
